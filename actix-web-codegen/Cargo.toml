[package]
name = "actix-web-codegen"
version = "4.5.0"
description = "Routing and runtime macros for Actix Web"
authors = ["Nikolay Kim <fafhrd91@gmail.com>", "Rob Ede <robjtede@icloud.com>"]
homepage.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[features]
default = ["compat-routing-macros-force-pub"]
compat-routing-macros-force-pub = []

[dependencies]
actix-router = { version = "0.5", path = "../actix-router", default-features = false }
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full", "extra-traits"] }

[dev-dependencies]
actix-macros = "0.2.4"
actix-rt = "2.2"
actix-test = { version = "0.1", path = "../actix-test" }
actix-utils = "3"
actix-web = { version = "4", path = "../actix-web" }

futures-core = { version = "0.3.17", default-features = false, features = ["alloc"] }
rustversion-msrv = "0.100"
trybuild = "1"

[lints]
workspace = true
